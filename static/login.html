<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindCare | Login</title>
<link rel="icon" type="image/x-icon" href="favi.ico">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<style>
/* -----------------------------------------------------
   GLOBAL BACKGROUND
----------------------------------------------------- */
body {
  margin: 0;
  font-family: 'Nunito', sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: linear-gradient(120deg, #305497, #2A5298);
  background-size: 200% 200%;
  animation: gradientFlow 18s ease infinite;
  position: relative;
  color: #fff;
}

@keyframes gradientFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

body::before {
  content: "";
  background: url("pic20.jpeg") no-repeat center center/cover;
  opacity: 0.28;
  position: fixed;
  inset: 0;
  z-index: 0;
}

/* -----------------------------------------------------
   TOP HEADER
----------------------------------------------------- */
.top-floating {
  position: fixed;
  top: 40px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 1100px;
  display: flex;
  justify-content: space-between;
  z-index: 100;
}

.top-floating .logo {
  font-size: 1.4rem;
  font-weight: bold;
}

.top-floating a {
  color: #fff;
  margin-left: 15px;
  font-size: 1rem;
  text-decoration: none;
}

.top-floating a:hover {
  color: #A1C4FD;
}

/* -----------------------------------------------------
   BUBBLES
----------------------------------------------------- */
.bubble {
  position: absolute;
  bottom: -100px;
  background: rgba(255,255,255,0.22);
  border-radius: 50%;
  animation: rise 16s infinite ease-in;
}

@keyframes rise {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-110vh); opacity: 0; }
}

/* -----------------------------------------------------
   CARD
----------------------------------------------------- */
.login-box {
  background: rgba(20, 40, 80, 0.65);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.25);
  padding: 50px 42px;
  border-radius: 22px;
  width: 400px;
  box-shadow: 0 20px 45px rgba(0,0,0,0.35);
  text-align: center;
  position: relative;
  z-index: 5;
}

/* -----------------------------------------------------
   AFFIRMATION
----------------------------------------------------- */
.affirmation {
  position: absolute;
  top: -35px;
  left: 50%;
  transform: translateX(-50%);
  opacity: .9;
  font-style: italic;
  font-size: .95rem;
  animation: fade 8s infinite ease-in-out;
}

@keyframes fade {
  0%,100% { opacity: 0; }
  50% { opacity: 1; }
}

/* -----------------------------------------------------
   FORM
----------------------------------------------------- */
input {
  width: 100%;
  padding: 12px 14px;
  border: none;
  border-radius: 12px;
  background: rgba(255,255,255,0.22);
  color: #fff;
  margin-bottom: 18px;
  font-size: 1rem;
  outline: none;
  transition: 0.3s;
}

input:focus {
  background: rgba(0,0,0,0.35);
  box-shadow: 0 0 8px rgba(161,196,253,0.7);
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 18px;
  border: none;
  background: #A1C4FD;
  color: #1a293b;
  font-weight: bold;
  cursor: pointer;
  transition: .3s;
}

button:hover {
  background: #fff;
  transform: scale(1.05);
}

/* Google button */
.google-btn {
  margin-top: 12px;
  width: 100%;
  background: #fff;
  color: #2C3E50;
  font-weight: 600;
  border-radius: 25px;
  padding: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  transition: 0.3s;
  border: none;
}

.google-btn:hover {
  background: #f2f2f2;
  transform: scale(1.03);
}

.google-btn img {
  width: 19px;
}

/* Links */
.signup-link, .forgot-link {
  margin-top: 10px;
  font-size: 0.9rem;
}

.signup-link a, .forgot-link a {
  color: #A1C4FD;
  font-weight: bold;
  text-decoration: none;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="top-floating">
  <div class="logo">MindCare</div>
  <div>
    <a href="/static/index.html">Home</a>
    <a href="/static/signup.html">Sign Up</a>
  </div>
</div>

<!-- Bubbles -->
<div class="bubble" style="width:35px;height:35px;left:20%;animation-delay:0s;"></div>
<div class="bubble" style="width:50px;height:50px;left:55%;animation-delay:2s;"></div>
<div class="bubble" style="width:25px;height:25px;left:70%;animation-delay:4s;"></div>

<!-- CARD -->
<div class="login-box" data-aos="fade-up">

  <div class="affirmation" id="affirmText">You’re taking a positive step today.</div>

  <h2>Welcome Back</h2>
  <p>Log in to continue your journey toward calmness</p>

  <form onsubmit="handleLogin(event)">
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="password" id="pass" placeholder="Password" required>

    <input type="text" id="calledName" placeholder="What would you like to be called?" required>

    <div class="forgot-link">
      <a href="/static/reset-password.html">Forgot Password?</a>
    </div>

    <button>Login</button>
  </form>

  <!--<button class="google-btn">
    <img src="https://www.svgrepo.com/show/475656/google-color.svg">
    Continue with Google
  </button> -->

  <div class="signup-link">
    New here? <a href="/static/signup.html">Create an account</a>
  </div>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
AOS.init({ duration: 1000 });

/* Affirmation text */
const affirmations = [
  "You're taking a positive step today.",
  "Your mind deserves a moment of peace.",
  "Small progress is still progress.",
  "Awareness is the beginning of growth."
];

let i = 0;
setInterval(() => {
  i = (i + 1) % affirmations.length;
  document.getElementById("affirmText").textContent = affirmations[i];
}, 8000);

async function handleLogin(e){
  e.preventDefault();

  const emailValue = document.getElementById("email").value;
  const passValue = document.getElementById("pass").value;
  const calledNameValue = document.getElementById("calledName").value;

  const res = await fetch("http://localhost:5000/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      email: emailValue,
      password: passValue
    })
  });

  const data = await res.json();

  if (!res.ok) {
    alert(data.error);
    return;
  }

  localStorage.setItem("mindcareUser", JSON.stringify({
    user_id: data.user_id,   // ADD THIS
    email: data.email,
    calledName: calledNameValue,
    loginTime: Date.now()
  }));


  window.location.href = "/static/dashboard.html";
}
</script>

</body>
</html>
