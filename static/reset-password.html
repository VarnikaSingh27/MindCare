<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindCare | Reset Password</title>
<link rel="icon" type="image/x-icon" href="favi.ico">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<style>
/* -----------------------------------------------------
   GLOBAL BACKGROUND
----------------------------------------------------- */
body {
  margin: 0;
  font-family: 'Nunito', sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: linear-gradient(120deg, #305497, #2A5298);
  background-size: 200% 200%;
  animation: gradientFlow 18s ease infinite;
  position: relative;
  color: #fff;
}

@keyframes gradientFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

body::before {
  content: "";
  background: url("pic20.jpeg") no-repeat center center/cover;
  opacity: 0.28;
  position: fixed;
  inset: 0;
  z-index: 0;
}

/* -----------------------------------------------------
   TOP HEADER (same as login/signup)
----------------------------------------------------- */
.top-floating {
  position: fixed;
  top: 40px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 1100px;
  display: flex;
  justify-content: space-between;
  z-index: 100;
}

.top-floating .logo {
  font-size: 1.4rem;
  font-weight: bold;
}

.top-floating a {
  color: #fff;
  margin-left: 15px;
  font-size: 1rem;
  text-decoration: none;
}

.top-floating a:hover {
  color: #A1C4FD;
}

/* -----------------------------------------------------
   BUBBLES
----------------------------------------------------- */
.bubble {
  position: absolute;
  bottom: -100px;
  background: rgba(255,255,255,0.22);
  border-radius: 50%;
  animation: rise 16s infinite ease-in;
}

@keyframes rise {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-110vh); opacity: 0; }
}

/* -----------------------------------------------------
   CARD
----------------------------------------------------- */
.reset-box {
  background: rgba(20, 40, 80, 0.65);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.25);
  width: 400px;
  padding: 45px 40px;
  border-radius: 22px;
  text-align: center;
  box-shadow: 0 20px 45px rgba(0,0,0,0.35);
  z-index: 5;
  position: relative;
}

/* -----------------------------------------------------
   AFFIRMATION
----------------------------------------------------- */
.affirmation {
  position: absolute;
  top: -35px;
  left: 50%;
  transform: translateX(-50%);
  opacity: .9;
  font-style: italic;
  font-size: .95rem;
  animation: fade 8s infinite ease-in-out;
}

@keyframes fade {
  0%,100% { opacity: 0; }
  50% { opacity: 1; }
}

/* -----------------------------------------------------
   FORM
----------------------------------------------------- */
h2 {
  margin-bottom: 10px;
  font-size: 2rem;
  font-weight: 700;
}

p {
  opacity: 0.9;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,0.22);
  color: #fff;
  margin-bottom: 20px;
  font-size: 1rem;
  outline: none;
}

input:focus {
  background: rgba(0,0,0,0.35);
  box-shadow: 0 0 8px rgba(161,196,253,0.7);
}

/* BUTTON */
button {
  width: 100%;
  padding: 12px;
  border-radius: 18px;
  border: none;
  background: #A1C4FD;
  color: #1a293b;
  font-weight: bold;
  cursor: pointer;
  transition: .3s;
}

button:hover {
  background: #fff;
  transform: scale(1.05);
}

/* BACK LINK */
.back {
  margin-top: 18px;
}

.back a {
  color: #A1C4FD;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="top-floating">
  <div class="logo">MindCare</div>
  <div>
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
  </div>
</div>

<!-- Bubbles -->
<div class="bubble" style="width:35px;height:35px;left:22%;animation-delay:0s;"></div>
<div class="bubble" style="width:55px;height:55px;left:48%;animation-delay:3s;"></div>
<div class="bubble" style="width:40px;height:40px;left:68%;animation-delay:1.5s;"></div>

<!-- RESET CARD -->
<div class="reset-box" data-aos="fade-up">

  <div class="affirmation" id="affirmText">You’re taking a positive step today.</div>

  <h2>Reset Password</h2>
  <p>Enter your email and we’ll send instructions</p>

  <form onsubmit="submitReset(event)">
    <input type="email" id="resetEmail" placeholder="Email Address" required>
    <button>Send Reset Link</button>
  </form>

  <div class="back">
    <a href="login.html">Back to Login</a>
  </div>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
AOS.init({ duration: 1000 });

/* Affirmation cycling (same as signup & login) */
const affirmations = [
  "You're taking a positive step today.",
  "Your mind deserves a moment of peace.",
  "Small progress is still progress.",
  "Awareness is the beginning of growth."
];

let i = 0;
setInterval(() => {
  i = (i + 1) % affirmations.length;
  document.getElementById("affirmText").textContent = affirmations[i];
}, 8000);

function submitReset(e){
  e.preventDefault();
  alert("A reset link has been sent to your email.");
  window.location.href = "login.html";
}
</script>

</body>
</html>
