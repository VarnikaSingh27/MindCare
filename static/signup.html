<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindCare | Sign Up</title>
<link rel="icon" type="image/x-icon" href="favi.ico">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<style>
/* BACKGROUND */
body {
  margin: 0;
  font-family: 'Nunito', sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: linear-gradient(120deg, #305497, #2A5298);
  background-size: 200% 200%;
  animation: gradientFlow 18s ease infinite;
  position: relative;
  color: #fff;
}

@keyframes gradientFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

body::before {
  content: "";
  background: url("pic20.jpeg") no-repeat center center/cover;
  opacity: 0.28;
  position: fixed;
  inset: 0;
  z-index: 0;
}

/* TOP HEADER */
.top-floating {
  position: fixed;
  top: 40px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 1100px;
  display: flex;
  justify-content: space-between;
  z-index: 100;
}
.top-floating .logo {
  font-size: 1.4rem;
  font-weight: bold;
}
.top-floating a {
  color: #fff;
  margin-left: 15px;
  font-size: 1rem;
  text-decoration: none;
}
.top-floating a:hover {
  color: #A1C4FD;
}

/* CARD */
.card {
  width: 900px;
  max-width: 95%;
  display: grid;
  grid-template-columns: 45% 55%;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 22px;
  padding: 40px;
  box-shadow: 0 20px 45px rgba(0,0,0,0.35);
  z-index: 5;
  position: relative;
}

/* LEFT SIDE */
.left {
  padding-right: 25px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
}
.left h2 {
  margin: 15px 0 5px 0;
  font-size: 2rem;
}

/* AFFIRMATION */
.affirmation {
  position: absolute;
  top: -35px;
  left: 50%;
  transform: translateX(-50%);
  opacity: .9;
  font-style: italic;
  font-size: .95rem;
  animation: fade 8s infinite ease-in-out;
}
@keyframes fade {
  0%,100% { opacity: 0; }
  50% { opacity: 1; }
}

/* FORM */
form {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
label {
  font-size: .9rem;
  opacity: .9;
}
input {
  width: 100%;
  padding: 12px 15px;
  border: none;
  border-radius: 12px;
  background: rgba(255,255,255,0.22);
  color: #fff;
  font-size: 1rem;
  outline: none;
}
input:focus {
  background: rgba(0, 0, 0, 0.35);
  box-shadow: 0 0 8px rgba(161,196,253,0.7);
}

.btn {
  padding: 12px;
  border-radius: 18px;
  background: #A1C4FD;
  border: none;
  font-weight: bold;
  color: #1a293b;
  cursor: pointer;
  transition: .25s ease;
}
.btn:hover {
  background: #fff;
  transform: scale(1.05);
}

/* GOOGLE BUTTON */
.google-btn {
  margin-top: 10px;
  width: 100%;
  background: #fff;
  color: #2C3E50;
  font-weight: 600;
  border-radius: 25px;
  padding: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  transition: 0.3s;
  border: none;
}
.google-btn:hover {
  background: #f2f2f2;
  transform: scale(1.03);
}
.google-btn img {
  width: 19px;
}
.small-link {
  font-size: .9rem;
  margin-top: 8px;
}
.small-link a {
  color: #A1C4FD;
  text-decoration: none;
  font-weight: bold;
}
.small-link a:hover {
  text-decoration: underline;
}

/* BUBBLES */
.bubble {
  position: absolute;
  bottom: -100px;
  background: rgba(255,255,255,0.22);
  border-radius: 50%;
  animation: rise 16s infinite ease-in;
}
@keyframes rise {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-110vh); opacity: 0; }
}
</style>
</head>
<body>

<!-- TOP HEADER -->
<div class="top-floating">
  <div class="logo">MindCare</div>
  <div>
    <a href="/static/index.html">Home</a>
    <a href="/static/login.html">Login</a>
  </div>
</div>

<!-- BUBBLES -->
<div class="bubble" style="width:30px;height:30px;left:20%;animation-delay:0s;"></div>
<div class="bubble" style="width:40px;height:40px;left:50%;animation-delay:2s;"></div>
<div class="bubble" style="width:25px;height:25px;left:70%;animation-delay:4s;"></div>

<!-- SIGNUP CARD -->
<div class="card" data-aos="fade-up">

  <div class="affirmation" id="affirmText">
    You're taking a positive step today.
  </div>

  <!-- LEFT SIDE -->
  <div class="left">
    <h2>Create Your Account</h2>
    <p>Your calm journey begins with awareness.</p>
  </div>

  <!-- FORM -->
  <form onsubmit="handleSignup(event)">

    <label>Full Name
      <input id="fullName" placeholder="Your full name" required>
    </label>

    <label>What would you like to be called?
      <input id="calledName" placeholder="Name we will greet you with" required>
    </label>

    <label>Email (optional)
      <input id="email" type="email" placeholder="you@example.com">
    </label>

    <label>Password
      <input id="password" type="password" placeholder="Create a password" required>
    </label>

    <button class="btn">Create Account</button>

    <button class="google-btn">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg">
      Continue with Google
    </button>

    <div class="small-link">
      Already have an account? <a href="/static/login.html">Sign in</a>
    </div>

  </form>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
AOS.init({ duration: 1000 });

/* ROTATING AFFIRMATIONS */
const affirmations = [
  "You're taking a positive step today.",
  "Your mind deserves a moment of peace.",
  "Awareness is the beginning of healing.",
  "Small steps lead to big changes."
];
let i = 0;
setInterval(() => {
  i = (i + 1) % affirmations.length;
  document.getElementById("affirmText").textContent = affirmations[i];
}, 8000);

async function handleSignup(e){
  e.preventDefault();

  const fullName = document.getElementById("fullName").value;
  const calledName = document.getElementById("calledName").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("http://localhost:5000/signup", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      email,
      password
    })
  });

  const data = await res.json();

  if (!res.ok) {
    alert(data.error);
    return;
  }

  // Save user name locally for greetings
  localStorage.setItem("mindcareUser", JSON.stringify({
    fullName,
    calledName,
    email,
    created: Date.now()
  }));

  window.location.href = "/static/dashboard.html";
}
</script>

</body>
</html>
